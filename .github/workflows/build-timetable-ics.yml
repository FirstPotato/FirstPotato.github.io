name: Build timetable ICS

on:
  push:
    paths:
      - "timetable/timetable.json"
      - "timetable/build_ics.py"
      - ".github/workflows/build-timetable-ics.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate ICS from JSON
        run: python timetable/build_ics.py
      - name: Commit ICS if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timetable/timetable.ics
          if git diff --cached --quiet; then
            echo "ICS unchanged"
            exit 0
          fi
          git commit -m "Regenerate timetable ICS from JSON."
          git push
