  <style>
    :root {
      --bg: #0b1220;
      --card: #152033;
      --line: #243249;
      --text: #e8eef8;
      --muted: #93a4bf;
      --accent: #7dd3fc;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    body { padding: env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom)); }
    header { padding: 18px 16px 10px; }
    .kicker { color: var(--muted); font-size: 12px; letter-spacing: .08em; }
    h1 { margin: 4px 0 0; font-size: 22px; }
    .sub { margin-top: 6px; color: var(--muted); font-size: 13px; }
    nav {
      position: fixed; left: 0; right: 0; bottom: 0;
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      background: #101a2c; border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom);
    }
    nav button {
      background: none; border: 0; color: var(--muted); padding: 12px 0 10px; font-size: 14px;
    }
    nav button.active { color: var(--accent); font-weight: 700; }
    .page { display: none; padding: 0 16px 16px; }
    .page.active { display: block; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      padding: 14px; margin-bottom: 10px;
    }
    .row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
    .course { font-size: 17px; font-weight: 700; }
    .meta { color: var(--muted); font-size: 13px; margin-top: 6px; line-height: 1.5; }
    .pill {
      font-size: 12px; padding: 3px 8px; border-radius: 999px; color: #081018; font-weight: 700;
    }
    .empty { color: var(--muted); text-align: center; padding: 48px 12px; }
    .day-title { margin: 16px 0 8px; color: var(--accent); font-size: 13px; font-weight: 700; }
    .week-bar { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px; }
    .week-bar button {
      flex: 0 0 auto; border: 1px solid var(--line); background: #101a2c; color: var(--text);
      border-radius: 12px; padding: 8px 10px; font-size: 12px;
    }
    .week-bar button.on { background: #1d4ed8; border-color: #1d4ed8; }
    .note { color: #fbbf24; font-size: 12px; margin-top: 6px; }
    #notices { color: #fbbf24; }
    .ios-actions { margin-top: 10px; font-size: 12px; color: var(--muted); line-height: 1.6; }
    .ios-actions a { color: var(--accent); }
  </style>
</head>

  <script>
    function startApp(DATA) {
    const WEEKDAYS = DATA.weekdayNames;
    const termMonday = new Date(DATA.termMonday + "T00:00:00");

    function pad(n) { return String(n).padStart(2, "0"); }
    function iso(d) { return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
    function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
    function mondayOf(d) {
      const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      const delta = (x.getDay() + 6) % 7;
      return addDays(x, -delta);
    }
    function weekNo(d) {
      const diff = Math.round((mondayOf(d) - termMonday) / 86400000);
      return DATA.weekStart + Math.floor(diff / 7);
    }
    function fmtDate(isoStr) {
      const [y,m,day] = isoStr.split("-");
      return Number(m) + "月" + Number(day) + "日";
    }

    const today = new Date();
    const todayIso = iso(today);
    const currentWeek = weekNo(today);

    document.getElementById("title").textContent = DATA.title.replace("2026–2027学年", "");
    document.getElementById("status").textContent =
      fmtDate(todayIso) + " · " + WEEKDAYS[(today.getDay()+6)%7] +
      (currentWeek >= DATA.weekStart && currentWeek <= DATA.weekEnd ? " · 第" + currentWeek + "周" : " · 不在上课周");
    document.getElementById("notices").textContent = (DATA.notes || []).filter(function (n) {
      return n.indexOf("停课") >= 0 || n.indexOf("顺延") >= 0 || n.indexOf("双选") >= 0 || n.indexOf("交考核") >= 0;
    }).join(" · ");

    function sessionsOn(dateIso) { return DATA.sessions.filter(s => s.date === dateIso); }
    function sessionsInWeek(w) { return DATA.sessions.filter(s => s.week === w); }

    function card(s) {
      return `<article class="card" style="border-left: 5px solid ${s.color}">
        <div class="row">
          <div class="course">${s.shortName}</div>
          <span class="pill" style="background:${s.color}">${s.period}</span>
        </div>
        <div class="meta">${s.location}<br>${s.course}</div>
        ${s.note ? `<div class="note">${s.note}</div>` : ""}
      </article>`;
    }

    function renderToday() {
      const list = sessionsOn(todayIso);
      const el = document.getElementById("page-today");
      if (!list.length) {
        el.innerHTML = `<div class="empty">今天没课</div>`;
        return;
      }
      el.innerHTML = list.map(card).join("");
    }

    function renderWeek() {
      let selected = currentWeek;
      if (selected < DATA.weekStart || selected > DATA.weekEnd) selected = DATA.weekStart;
      const el = document.getElementById("page-week");
      function paint(w) {
        const buttons = [];
        for (let i = DATA.weekStart; i <= DATA.weekEnd; i++) {
          buttons.push(`<button data-w="${i}" class="${i===w?"on":""}">第${i}周</button>`);
        }
        const list = sessionsInWeek(w);
        const byDay = {};
        WEEKDAYS.forEach(name => byDay[name] = []);
        list.forEach(s => byDay[s.weekday].push(s));
        let body = "";
        WEEKDAYS.forEach(name => {
          const items = byDay[name];
          if (!items.length) return;
          body += `<div class="day-title">${name} · ${fmtDate(items[0].date)}</div>` + items.map(card).join("");
        });
        if (!body) body = `<div class="empty">这一周没有课</div>`;
        el.innerHTML = `<div class="week-bar">${buttons.join("")}</div>` + body;
        el.querySelectorAll("[data-w]").forEach(btn => {
          btn.onclick = () => paint(Number(btn.dataset.w));
        });
      }
      paint(selected);
    }

    function renderCourses() {
      const groups = {};
      DATA.courses.forEach(c => {
        (groups[c.shortName] ||= []).push(c);
      });
      const el = document.getElementById("page-courses");
      el.innerHTML = Object.keys(groups).map(name => {
        const items = groups[name];
        const color = items[0].color;
        const rows = items.map(c =>
          `<div class="meta">${c.weekday} ${c.period} · ${c.location}<br>周次 ${c.weeks}${c.note ? " · " + c.note : ""}</div>`
        ).join("");
        return `<article class="card" style="border-left:5px solid ${color}">
          <div class="course">${name}</div>
          <div class="meta">${items[0].course}</div>
          ${rows}
        </article>`;
      }).join("");
    }

    renderToday();
    renderWeek();
    renderCourses();

    document.querySelectorAll("nav button").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("page-" + btn.dataset.page).classList.add("active");
      };
    });
    }
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" });
    }
    (async function () {
      var data = null;
      try {
        var res = await fetch("./timetable.json", { cache: "no-store" });
        if (res.ok) data = await res.json();
      } catch (err) {}
      if (!data) {
        data = JSON.parse(document.getElementById("timetable-data").textContent);
      }
      startApp(data);
    })();
  </script>
</body>
</html>
